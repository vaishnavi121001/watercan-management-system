<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}My Delivery App{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Custom CSS overrides -->
    <style>
        /* Navbar */
        .navbar {
            background: linear-gradient(90deg, #0f766e, #256d85);
            box-shadow: 0 3px 8px rgba(15, 118, 110, 0.5);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 0.05em;
            color: #d9f99d !important; /* light lime */
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            transition: color 0.3s ease;
        }
        .navbar-brand:hover {
            color: #bef264 !important;
        }
        .nav-link {
            font-weight: 600;
            color: #e0f2fe !important; /* very light cyan */
            transition: color 0.3s ease;
        }
        .nav-link:hover, .nav-link:focus {
            color: #a7f3d0 !important; /* mint */
        }
        .btn-danger {
            background-color: #dc2626;
            border: none;
            box-shadow: 0 4px 8px rgba(220, 38, 38, 0.4);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-danger:hover {
            background-color: #b91c1c;
            box-shadow: 0 6px 14px rgba(185, 28, 28, 0.6);
        }

        /* Container */
        .container {
            max-width: 960px;
            padding-top: 20px;
            padding-bottom: 40px;
        }

        /* Alerts */
        .alert {
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(15, 118, 110, 0.15);
        }
        .alert-dismissible .btn-close {
            filter: invert(0.4);
            transition: filter 0.2s ease;
        }
        .alert-dismissible .btn-close:hover {
            filter: invert(0.8);
        }

        /* Responsive tweaks */
        @media (max-width: 575.98px) {
            .navbar-brand {
                font-size: 1.3rem;
            }
            .nav-link {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'owner:owner_dashboard' %}">Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                     <li class="nav-item">
                        <a class="nav-link" href="{% url 'owner:owner_dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'owner:view_customers' %}">Customers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'owner:view_delivery_boys' %}">Delivery Boys</a>
                    </li>
                    <!-- Logout button -->
                    <li class="nav-item ms-3">
                        <a class="btn btn-danger text-white" href="{% url 'owner:logout' %}" role="button">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main container -->
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        <!-- Page specific content goes here -->
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Water Cans System{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome for better chatbot icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom External CSS (optional) -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <style>
        /* Chatbot button styling */
        #chatbot-button {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: linear-gradient(135deg, #4a90e2, #007bff);
            color: white;
            border: none;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.3s;
            z-index: 10000;
        }

        #chatbot-button:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.6);
        }

        /* Chatbot iframe styling */
        #chatbot-iframe {
            position: fixed;
            bottom: 100px;
            right: 25px;
            width: 400px;
            height: 500px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
            display: none;
            z-index: 9999;
            overflow: hidden;
        }
    </style>
</head>
<body>

    {% block content %}{% endblock %}

    <!-- Chatbot -->
    <button id="chatbot-button"><i class="fas fa-comment-dots"></i></button>
    <iframe id="chatbot-iframe" src="{% url 'help_chat' %}"></iframe>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chatbot toggle script -->
    <script>
        const btn = document.getElementById('chatbot-button');
        const iframe = document.getElementById('chatbot-iframe');

        btn.addEventListener('click', () => {
            iframe.style.display = iframe.style.display === 'none' ? 'block' : 'none';
        });
    </script>

</body>
</html>

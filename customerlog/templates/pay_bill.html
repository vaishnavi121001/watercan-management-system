{% extends 'base.html' %}

{% block title %}Pay Bill{% endblock %}

{% block content %}
<h2>Pay Bill for {{ bill.month|date:"F Y" }}</h2>

<p>Total Cans: {{ bill.total_cans }}</p>
<p>Amount Due: ₹{{ bill.amount_due|floatformat:2 }}</p>
<p>Status: {{ bill.payment_status }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-success">Confirm Payment</button>
    <a href="{% url 'view_bills' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

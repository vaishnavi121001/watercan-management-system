{% extends "base.html" %}

{% block title %}
    {% if is_edit %}Edit{% else %}Schedule{% endif %} Daily Delivery
{% endblock %}

{% block content %}
<div class="form-container">
    <h2 class="form-title">{% if is_edit %}Edit{% else %}Create{% endif %} Daily Water Can Schedule</h2>

    <form method="post" class="schedule-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">
            {% if is_edit %}Update{% else %}Submit{% endif %}
        </button>
    </form>

    <a href="{% url 'customer_dashboard' %}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
{% endblock %}
